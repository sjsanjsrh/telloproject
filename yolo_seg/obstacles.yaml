world:
  unit: cm
  axis: tello

obstacles:
  - id: A
    class_name: A
    position_cm: [100, 0, 100]
    yaw_deg: 0
    shape:
      type: rectangle_frame
      size_cm:
        width: 80
        height: 75
      thickness_cm: 3

  - id: B
    class_name: B
    position_cm: [200, 0, 50]
    yaw_deg: 45
    shape:
      type: rectangle_frame
      size_cm:
        width: 80
        height: 75
      thickness_cm: 3

  - id: C
    class_name: C
    position_cm: [200, 100, 100]
    yaw_deg: 90
    shape:
      type: rectangle_frame
      size_cm:
        width: 80
        height: 75
      thickness_cm: 3


  - id: START
    class_name: START
    position_cm: [-30, 0, 0]
    yaw_deg: 0
    color_bgr: [200, 200, 200]
    shape:
      type: start_area
      size_cm:
        width: 60
        height: 60

  - id: LANDING
    class_name: LANDING
    position_cm: [200, 225, 0]
    yaw_deg: 0
    color_bgr: [80, 80, 255]
    shape:
      type: landing_zone
      size_cm:
        diameter: 50
        pillar_diameter: 20
        pillar_height: 20
